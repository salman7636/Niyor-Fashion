[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npx vite --host 127.0.0.1"
  targetPort = 5173
  port = 8888

[[redirects]]
  from = "/api/orders/create-cod"
  to = "/.netlify/functions/cod-create-order"
  status = 200
  force = true

[[redirects]]
  from = "/api/orders/cancel-cod"
  to = "/.netlify/functions/cod-cancel-order"
  status = 200
  force = true

[[redirects]]
  from = "/api/razorpay/create-order"
  to = "/.netlify/functions/razorpay-create-order"
  status = 200
  force = true

[[redirects]]
  from = "/api/razorpay/verify-payment"
  to = "/.netlify/functions/razorpay-verify-payment"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/orders"
  to = "/.netlify/functions/admin-orders"
  status = 200
  force = true
